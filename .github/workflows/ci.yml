name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: plugins/codex-blog/requirements-dev.txt
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r plugins/codex-blog/requirements-dev.txt
          python -m pip install -e plugins/codex-blog
      - name: Validate repository
        run: |
          python scripts/validate_repo.py
          python plugins/codex-blog/scripts/generate_agents.py --check
      - name: Test installer and package
        run: python -m pytest -q tests plugins/codex-blog/tests

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plugins/codex-blog/requirements-dev.txt
      - run: python -m pip install -r plugins/codex-blog/requirements-dev.txt
      - name: Ruff
        run: python -m ruff check scripts plugins/codex-blog/src plugins/codex-blog/setup.py
      - name: Build package
        run: python -m build plugins/codex-blog
      - name: Smoke standalone wheel
        run: python scripts/smoke_wheel.py plugins/codex-blog/dist
      - name: Validate release boundaries
        run: |
          python scripts/check_release.py
          python plugins/codex-blog/scripts/generate_agents.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: plugins/codex-blog/dist/*
