repos:
  - repo: local
    hooks:
      - id: validate-codex-blog
        name: validate Codex Blog repository
        entry: python3 scripts/validate_repo.py
        language: system
        pass_filenames: false
      - id: no-private-email
        name: reject private commit email in tracked text
        entry: python3 scripts/check_private_data.py
        language: system
        pass_filenames: false
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8
    hooks:
      - id: ruff-check
