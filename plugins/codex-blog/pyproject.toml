[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-blog"
version = "2.1.2"
description = "Article-first SEO content production runtime for OpenAI Codex"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  {name = "BruceL017", email = "253661133+BruceL017@users.noreply.github.com"},
  {name = "Daniel Agrici"}
]
keywords = ["blog", "codex", "seo", "geo", "content-pipeline", "schema"]
dependencies = []

[project.optional-dependencies]
analysis = [
  "beautifulsoup4>=4.12,<5",
  "textstat>=0.7.3,<1"
]
render = [
  "markdown>=3.5,<4",
  "Pillow>=11.3,<13",
  "weasyprint>=60.2,<65"
]
dev = [
  "build>=1.2,<2",
  "Pillow>=11.3,<13",
  "pytest>=8,<10",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "ruff>=0.12,<1",
  "tomli>=2,<3; python_version < '3.11'"
]
all = [
  "beautifulsoup4>=4.12,<5",
  "textstat>=0.7.3,<1",
  "markdown>=3.5,<4",
  "Pillow>=11.3,<13",
  "weasyprint>=60.2,<65"
]

[project.scripts]
codex-blog = "codex_blog.cli:main"

[project.urls]
Homepage = "https://github.com/BruceL017/codex-blog"
Repository = "https://github.com/BruceL017/codex-blog"
Issues = "https://github.com/BruceL017/codex-blog/issues"
Documentation = "https://github.com/BruceL017/codex-blog/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
